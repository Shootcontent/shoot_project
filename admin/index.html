<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SHOOT. Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      color: #000;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      padding: 48px 40px;
    }

    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8a8a8a;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #fff;
      border: 1px solid #d4d4d4;
      border-radius: 4px;
      color: #000;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #000; }
    input::placeholder { color: #a8a8a8; }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fdecec;
      border: 1px solid #f0c4c4;
      border-radius: 4px;
      font-size: 12px;
      color: #b83232;
      display: none;
    }
    .error.visible { display: block; }

    @media (max-width: 480px) { .card { padding: 36px 24px; } }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">SHOOT. Photographic Studios</div>
    <h1>Admin<br>Access.</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Enter username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
      </div>
      <button class="btn" type="submit" id="submitBtn">Sign In</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    // Redirect to dashboard if already authenticated
    fetch('/api/admin/me', { credentials: 'same-origin' })
      .then(r => { if (r.ok) window.location.replace('/admin/dashboard.html'); })
      .catch(() => {});

    const form      = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg  = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter your username and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res  = await fetch('/api/admin/login', {
          method:      'POST',
          credentials: 'same-origin',
          headers:     { 'Content-Type': 'application/json' },
          body:        JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok) {
          window.location.replace('/admin/dashboard.html');
        } else {
          showError(data.error || 'Login failed. Please try again.');
        }
      } catch {
        showError('Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }
  </script>

</body>
</html>

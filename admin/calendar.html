<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SHOOT. Admin — Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <script src="/admin/assets/nav.js" defer></script>
  <style>
    /* ── Header controls ───────────────────────────────── */
    .cal-label { font-size: 13px; font-weight: 700; letter-spacing: 0.2px; color: #555; }
    .view-btns { display: flex; border: 1px solid #d4d4d4; border-radius: 4px; overflow: hidden; background: #fff; }
    .view-btn {
      font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 7px 14px; border: none; cursor: pointer;
      background: #fff; color: #555; transition: background 0.15s, color 0.15s;
      border-right: 1px solid #d4d4d4;
    }
    .view-btn:last-child { border-right: none; }
    .view-btn:hover { background: #f5f5f5; color: #000; }
    .view-btn.active { background: #000; color: #fff; }
    .cal-scroll { overflow-x: auto; }
    .cal-loading { padding: 48px; text-align: center; color: #8a8a8a; font-size: 12px; }
    .cal-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: #555; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .cal-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    /* ── Month view ───────────────────────────────────── */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .month-day-header {
      font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #555; padding: 10px 8px; text-align: center;
      background: #f7f7f7;
      border-bottom: 1px solid #e6e6e6;
      border-right: 1px solid #eeeeee;
    }
    .month-day-header:nth-child(7) { border-right: none; }
    .month-cell {
      min-height: 96px; padding: 6px; border-right: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0; background: #fff; min-width: 0;
    }
    .month-cell:nth-child(7n) { border-right: none; }
    .month-cell.other-month { background: #fafafa; }
    .month-cell.other-month > * { opacity: 0.45; }
    .month-cell.is-today { background: #f3faf6; }
    .month-cell-date {
      font-size: 12px; font-weight: 700; font-style: italic; color: #8a8a8a;
      margin-bottom: 4px; line-height: 1;
    }
    .month-cell-date.today {
      color: #fff; background: #000; border-radius: 999px;
      display: inline-block; padding: 3px 7px; font-style: normal;
    }
    .month-event {
      display: block; font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
      padding: 3px 5px; border-radius: 3px; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-decoration: none; color: #000; cursor: pointer; transition: opacity 0.1s;
      border-left: 2px solid transparent;
    }
    .month-event:hover { opacity: 0.75; }
    .month-event-time { color: #555; }
    .month-more { font-size: 9px; color: #8a8a8a; padding: 1px 5px; }

    /* Studio colours (after .month-event so they win) */
    .month-event-curve   { background: #eaf0fd; border-left-color: #2f5bd3; }
    .month-event-studio1 { background: #fdf4e3; border-left-color: #d98e04; }
    .month-event-pool    { background: #e8f6ee; border-left-color: #1f9d55; }
    .month-event-block   { background: #f2f2f2; border-left-color: #bdbdbd; color: #8a8a8a; }
    .swatch-curve { background: #2f5bd3; } .swatch-studio1 { background: #d98e04; }
    .swatch-pool { background: #1f9d55; } .swatch-block { background: #bdbdbd; }

    /* Legend only applies to the month view */
    .cal-scroll:not(:has(.month-grid)) + .cal-legend { display: none; }

    /* ── Week view ────────────────────────────────────── */
    .week-grid {
      display: grid;
      grid-template-columns: 90px repeat(7, minmax(0, 1fr));
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      overflow: hidden;
      min-width: 760px;
      background: #fff;
    }
    .week-corner {
      background: #f7f7f7;
      border-bottom: 1px solid #e6e6e6;
      border-right: 1px solid #e6e6e6;
    }
    .week-day-header {
      background: #f7f7f7;
      border-bottom: 1px solid #e6e6e6;
      border-right: 1px solid #eeeeee;
      padding: 10px 8px; text-align: center;
    }
    .week-day-header:last-child { border-right: none; }
    .week-day-header.is-today { background: #eef7f2; }
    .week-day-name { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8a8a8a; margin-bottom: 4px; }
    .week-day-num { font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: -0.5px; line-height: 1; }
    .week-day-num.today { color: #1f9d55; }
    .week-studio-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: #555; padding: 10px 8px;
      border-right: 1px solid #e6e6e6;
      border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: flex-start; background: #fafafa;
    }
    .week-cell {
      border-right: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
      padding: 6px; min-height: 84px; min-width: 0;
    }
    .week-cell:nth-child(8n) { border-right: none; }
    .week-cell.last, .week-studio-label.last { border-bottom: none; }
    .week-empty { color: #d4d4d4; font-size: 10px; text-align: center; padding-top: 20px; }
    .cal-event { overflow-wrap: anywhere; }
    .cal-event-badge { margin-top: 3px; }
    .cal-event-block { background: #f5f5f5; border-color: #e6e6e6; color: #8a8a8a; cursor: default; }
    .cal-event-block:hover { border-color: #e6e6e6; }

    /* ── Day view ─────────────────────────────────────── */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .day-column {
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      overflow: hidden;
    }
    .day-column-header {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #000; padding: 12px 16px;
      border-bottom: 1px solid #e6e6e6;
      background: #f7f7f7;
    }
    .day-event {
      display: block; padding: 12px 16px;
      border: none; border-radius: 0; margin: 0;
      border-bottom: 1px solid #f0f0f0;
      text-decoration: none; color: #000; transition: background 0.1s; cursor: pointer;
    }
    .day-event:hover { background: #fafafa; }
    .day-event:last-child { border-bottom: none; }
    .day-event-time { font-size: 10px; color: #8a8a8a; letter-spacing: 0.5px; margin-bottom: 4px; }
    .day-event-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .day-event-name.muted-name { color: #8a8a8a; }
    .day-event-block { background: #fafafa; cursor: default; }
    .day-empty { padding: 32px 16px; color: #a8a8a8; font-size: 12px; text-align: center; }

    /* ── Booking pop-up (bk-* classes stay clear of shared modal styles) ── */
    .bk-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 9999;
      align-items: center; justify-content: center; padding: 20px;
    }
    .bk-box {
      background: #fff; color: #000; border: 1px solid #e6e6e6; border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      width: 100%; max-width: 400px; padding: 28px; position: relative;
    }
    .bk-close { position: absolute; top: 14px; right: 14px; }
    .bk-label { margin: 0 0 3px; font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #8a8a8a; }
    .bk-value { margin: 0 0 16px; font-size: 14px; font-weight: 600; color: #000; }
    .bk-ref { font-size: 17px; font-weight: 900; letter-spacing: 2px; }
    .bk-status { margin-bottom: 22px; text-transform: capitalize; }
    .bk-actions { display: flex; gap: 10px; }
    .bk-actions .btn { flex: 1; padding: 12px; }

    @media (max-width: 768px) {
      .day-grid { grid-template-columns: 1fr; }
      .week-grid { grid-template-columns: 70px repeat(7, minmax(0, 1fr)); }
      .month-cell { min-height: 64px; padding: 4px; }
      .month-event { font-size: 8px; padding: 2px 3px; }
      .month-day-header { padding: 8px 2px; letter-spacing: 1px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-left">
      <a class="nav-brand" href="/admin/dashboard.html">SHOOT. <span>Admin</span></a>
      <div class="nav-links">
        <a class="nav-link" href="/admin/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/admin/bookings.html">Bookings</a>
        <a class="nav-link active" href="/admin/calendar.html">Calendar</a>
        <a class="nav-link" href="/admin/coupons.html">Coupons</a>
        <a class="nav-link" href="/admin/create-booking.html">Create Booking</a>
        <a class="nav-link" href="/admin/pending-payments.html">Payments</a>
        <a class="nav-link" href="/admin/slot-manager.html">Slots</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="nav-user" id="navUser">—</div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
    </div>
  </nav>

  <!-- Booking popup modal (bk-* classes) -->
  <div id="bkOverlay" class="bk-overlay" onclick="if(event.target===this)closeBkModal()" style="display:none">
    <div class="bk-box">
      <button class="modal-close bk-close" onclick="closeBkModal()" aria-label="Close">✕</button>
      <p class="bk-label">Booking Ref</p>
      <p id="bkRef" class="bk-value bk-ref"></p>
      <p class="bk-label">Client</p>
      <p id="bkName" class="bk-value"></p>
      <p class="bk-label">Studio &amp; Time</p>
      <p id="bkStudio" class="bk-value"></p>
      <p class="bk-label">Status</p>
      <p id="bkStatus" class="bk-value bk-status"></p>
      <div class="bk-actions">
        <a id="bkViewLink" href="#" class="btn btn-ghost">View Details</a>
        <button id="bkCancelBtn" class="btn btn-danger-solid" onclick="doCancelBooking()">Cancel Booking</button>
      </div>
    </div>
  </div>

  <main>
    <!-- Header: title + controls -->
    <div class="page-header">
      <div>
        <div class="page-title">Calendar.</div>
        <div class="page-sub cal-label" id="calLabel"></div>
      </div>
      <div class="btn-row">
        <!-- Navigation -->
        <button class="btn btn-ghost btn-sm" id="prevBtn">← Prev</button>
        <button class="btn btn-ghost btn-sm" id="todayBtn">Today</button>
        <button class="btn btn-ghost btn-sm" id="nextBtn">Next →</button>
        <!-- View switcher -->
        <div class="view-btns">
          <button class="view-btn" data-view="month">Month</button>
          <button class="view-btn active" data-view="week">Week</button>
          <button class="view-btn" data-view="day">Day</button>
        </div>
      </div>
    </div>

    <div class="cal-scroll">
      <div id="calContainer">
        <div class="cal-loading">Loading...</div>
      </div>
    </div>
    <div class="cal-legend">
      <span><i class="swatch-curve"></i>The Curve</span>
      <span><i class="swatch-studio1"></i>Studio One</span>
      <span><i class="swatch-pool"></i>The Pool</span>
      <span><i class="swatch-block"></i>Blocked</span>
    </div>
  </main>

  <script>
    const STUDIOS = [
      { key: 'curve',   label: 'The Curve' },
      { key: 'studio1', label: 'Studio One' },
      { key: 'pool',    label: 'The Pool' },
    ];
    const DAY_NAMES  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const STATUS_CLASS = { confirmed: 'badge-green', cancelled: 'badge-red', pending: 'badge-yellow' };
    const STUDIO_EVENT_CLASS = { curve: 'month-event-curve', studio1: 'month-event-studio1', pool: 'month-event-pool' };

    let view = 'week';
    let currentDate = new Date();
    let allBookings = [];
    let allBlocks   = [];

    // ── Date helpers ───────────────────────────────────────────────────────
    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
      date.setHours(0, 0, 0, 0);
      return date;
    }
    function toCA(d) { return d.toLocaleDateString('en-CA', { timeZone: 'Africa/Johannesburg' }); }
    function todayStr() { return toCA(new Date()); }
    function fmtShort(s) { if (!s) return '—'; const d = new Date(s + 'T12:00:00'); return `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)}`; }

    function getVisibleRange() {
      if (view === 'month') {
        const y = currentDate.getFullYear(), m = currentDate.getMonth();
        const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
        return { from: toCA(first), to: toCA(last) };
      }
      if (view === 'week') {
        const mon = getMonday(currentDate); const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
        return { from: toCA(mon), to: toCA(sun) };
      }
      const d = toCA(currentDate);
      return { from: d, to: d };
    }

    // ── Data loading ────────────────────────────────────────────────────────
    async function loadData() {
      const { from, to } = getVisibleRange();
      try {
        // Bookings for visible range
        const r = await fetch(`/api/admin/bookings?from=${from}&to=${to}&limit=500`, { credentials: 'same-origin' });
        if (r.ok) {
          const d = await r.json();
          allBookings = d.bookings || [];
          // If paginated (shouldn't happen with limit=500, but just in case)
          if (d.pages > 1) {
            for (let p = 2; p <= d.pages; p++) {
              const r2 = await fetch(`/api/admin/bookings?from=${from}&to=${to}&limit=500&page=${p}`, { credentials: 'same-origin' });
              if (r2.ok) { const d2 = await r2.json(); allBookings = allBookings.concat(d2.bookings || []); }
            }
          }
        }
        // All blocks (filter client-side)
        const rb = await fetch('/api/admin/slots?all=1', { credentials: 'same-origin' });
        if (rb.ok) { const db = await rb.json(); allBlocks = db.blocks || []; }
      } catch (err) {
        console.error('Failed to load calendar data:', err);
      }
    }

    // ── Navigation ──────────────────────────────────────────────────────────
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (view === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
      else if (view === 'week') currentDate.setDate(currentDate.getDate() - 7);
      else currentDate.setDate(currentDate.getDate() - 1);
      refresh();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (view === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
      else if (view === 'week') currentDate.setDate(currentDate.getDate() + 7);
      else currentDate.setDate(currentDate.getDate() + 1);
      refresh();
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date(); refresh();
    });
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        view = btn.dataset.view;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        refresh();
      });
    });

    async function refresh() {
      document.getElementById('calContainer').innerHTML =
        '<div class="cal-loading">Loading...</div>';
      await loadData();
      render();
    }

    // ── Render ──────────────────────────────────────────────────────────────
    function render() {
      updateLabel();
      if (view === 'month') renderMonth();
      else if (view === 'week') renderWeek();
      else renderDay();
    }

    function updateLabel() {
      const el = document.getElementById('calLabel');
      if (view === 'month') {
        el.textContent = `${MONTH_NAMES[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
      } else if (view === 'week') {
        const mon = getMonday(currentDate);
        const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
        el.textContent = `${fmtShort(toCA(mon))} — ${fmtShort(toCA(sun))} ${mon.getFullYear()}`;
      } else {
        const d = new Date(toCA(currentDate) + 'T12:00:00');
        el.textContent = `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
      }
    }

    // ── Month render ────────────────────────────────────────────────────────
    function renderMonth() {
      const y = currentDate.getFullYear(), m = currentDate.getMonth();
      const firstDay = new Date(y, m, 1), lastDay = new Date(y, m + 1, 0);
      const today = todayStr();

      // Offset: Monday-based (Mon=0 ... Sun=6)
      let startDow = firstDay.getDay(); // 0=Sun
      const offset = startDow === 0 ? 6 : startDow - 1;
      const totalCells = Math.ceil((offset + lastDay.getDate()) / 7) * 7;

      // Index bookings & blocks by date
      const byDate = {};
      const blocksByDate = {};
      for (const b of allBookings) {
        if (!byDate[b.date]) byDate[b.date] = [];
        byDate[b.date].push(b);
      }
      for (const blk of allBlocks) {
        if (!blocksByDate[blk.date]) blocksByDate[blk.date] = [];
        blocksByDate[blk.date].push(blk);
      }

      let html = '<div class="month-grid">';
      // Headers
      ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
        html += `<div class="month-day-header">${d}</div>`;
      });

      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - offset + 1;
        const date = new Date(y, m, dayNum);
        const dateStr = toCA(date);
        const isCurrentMonth = date.getMonth() === m;
        const isToday = dateStr === today;

        const events = (byDate[dateStr] || []).sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
        const blocks = blocksByDate[dateStr] || [];
        const MAX_VISIBLE = 3;
        const totalEvents = events.length + blocks.length;
        const overflow = totalEvents - MAX_VISIBLE;

        html += `<div class="month-cell ${isCurrentMonth ? '' : 'other-month'} ${isToday ? 'is-today' : ''}">`;
        html += `<div class="month-cell-date ${isToday ? 'today' : ''}">${date.getDate()}</div>`;

        let shown = 0;
        for (const b of events) {
          if (shown >= MAX_VISIBLE) break;
          const studio = (b.studios || [])[0] || '';
          const cls = STUDIO_EVENT_CLASS[studio] || '';
          html += `<a class="month-event ${cls}" href="/admin/booking-detail.html?id=${esc(b.bookingId)}" title="${esc(b.name)} · ${esc(b.studiosLabel)} · ${b.time || ''}">
            ${b.time ? `<span class="month-event-time">${b.time}</span> ` : ''}${esc(b.name || b.studiosLabel)}
          </a>`;
          shown++;
        }
        for (const blk of blocks) {
          if (shown >= MAX_VISIBLE) break;
          html += `<div class="month-event month-event-block" title="${esc(blk.reason || 'Blocked')}">
            ${blk.scope === 'full_day' ? 'Blocked' : `${blk.startTime} Blocked`}
          </div>`;
          shown++;
        }
        if (overflow > 0) {
          html += `<div class="month-more">+${overflow} more</div>`;
        }
        html += '</div>';
      }
      html += '</div>';
      document.getElementById('calContainer').innerHTML = html;
    }

    // ── Week render ─────────────────────────────────────────────────────────
    function renderWeek() {
      const mon = getMonday(currentDate);
      const today = todayStr();
      const weekDates = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mon); d.setDate(d.getDate() + i);
        return toCA(d);
      });

      // Index by date+studio
      const byDS = {};
      for (const b of allBookings) {
        for (const s of (b.studios || [])) {
          const k = `${b.date}|${s}`;
          if (!byDS[k]) byDS[k] = [];
          byDS[k].push(b);
        }
      }
      const blocksByDS = {};
      for (const blk of allBlocks) {
        const k = `${blk.date}|${blk.studio}`;
        if (!blocksByDS[k]) blocksByDS[k] = [];
        blocksByDS[k].push(blk);
      }

      let html = '<div class="week-grid">';
      // Corner + headers
      html += '<div class="week-corner"></div>';
      weekDates.forEach(date => {
        const d = new Date(date + 'T12:00:00');
        const isToday = date === today;
        html += `<div class="week-day-header ${isToday ? 'is-today' : ''}">
          <div class="week-day-name">${DAY_NAMES[d.getDay()]}</div>
          <div class="week-day-num ${isToday ? 'today' : ''}">${d.getDate()}</div>
        </div>`;
      });

      // Studio rows
      STUDIOS.forEach((studio, si) => {
        const isLast = si === STUDIOS.length - 1;
        html += `<div class="week-studio-label ${isLast ? 'last' : ''}">${studio.label}</div>`;
        weekDates.forEach(date => {
          const events = (byDS[`${date}|${studio.key}`] || []).sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
          const blocks = blocksByDS[`${date}|${studio.key}`] || [];
          html += `<div class="week-cell ${isLast ? 'last' : ''}">`;
          if (!events.length && !blocks.length) {
            html += '<div class="week-empty">—</div>';
          }
          events.forEach(b => {
            const sc = STATUS_CLASS[b.status] || 'badge-grey';
            html += `<div class="cal-event" onclick="openBkModal('${esc(b.bookingId)}')">
              <div class="cal-event-time">${b.time || '—'} · ${esc(b.duration)}</div>
              <div>${esc(b.name)}</div>
              <div class="cal-event-badge"><span class="badge badge-xs ${sc}">${b.status}</span></div>
            </div>`;
          });
          blocks.forEach(blk => {
            html += `<div class="cal-event cal-event-block">
              <div class="cal-event-time">${blk.scope === 'full_day' ? 'All Day' : blk.startTime + ' – ' + blk.endTime}</div>
              <div>${esc(blk.reason || 'Blocked')}</div>
            </div>`;
          });
          html += '</div>';
        });
      });
      html += '</div>';
      document.getElementById('calContainer').innerHTML = html;
    }

    // ── Day render ──────────────────────────────────────────────────────────
    function renderDay() {
      const dateStr = toCA(currentDate);
      const dayBookings = allBookings.filter(b => b.date === dateStr);
      const dayBlocks   = allBlocks.filter(b => b.date === dateStr);

      let html = '<div class="day-grid">';
      STUDIOS.forEach(studio => {
        const events = dayBookings.filter(b => (b.studios || []).includes(studio.key))
          .sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
        const blocks = dayBlocks.filter(b => b.studio === studio.key)
          .sort((a, b) => a.startMins - b.startMins);

        html += `<div class="day-column">
          <div class="day-column-header">${studio.label}</div>`;

        if (!events.length && !blocks.length) {
          html += '<div class="day-empty">No bookings</div>';
        }

        events.forEach(b => {
          const sc = STATUS_CLASS[b.status] || 'badge-grey';
          html += `<div class="cal-event day-event" onclick="openBkModal('${esc(b.bookingId)}')">
            <div class="day-event-time">${b.time || '—'} · ${esc(b.duration)}</div>
            <div class="day-event-name">${esc(b.name)}</div>
            <div><span class="badge badge-xs ${sc}">${b.status}</span></div>
          </div>`;
        });
        blocks.forEach(blk => {
          html += `<div class="day-event day-event-block">
            <div class="day-event-time">${blk.scope === 'full_day' ? 'All Day' : blk.startTime + ' – ' + blk.endTime}</div>
            <div class="day-event-name muted-name">${esc(blk.reason || 'Blocked')}</div>
          </div>`;
        });

        html += '</div>';
      });
      html += '</div>';
      document.getElementById('calContainer').innerHTML = html;
    }

    // ── Booking modal (global functions, inline style, no CSS class deps) ────
    let activeBookingId = null;

    window.openBkModal = function(id) {
      const b = allBookings.find(x => x.bookingId === id);
      if (!b) return;
      activeBookingId = id;
      document.getElementById('bkRef').textContent    = id;
      document.getElementById('bkName').textContent   = b.name || (b.firstName + ' ' + b.lastName);
      document.getElementById('bkStudio').textContent = (b.studiosLabel || '') + (b.time ? ' · ' + b.time : '') + (b.duration ? ' · ' + b.duration : '');
      document.getElementById('bkStatus').textContent = b.status || b.bookingStatus || '';
      document.getElementById('bkViewLink').href      = '/admin/booking-detail.html?id=' + encodeURIComponent(id);
      const btn = document.getElementById('bkCancelBtn');
      btn.textContent = 'Cancel Booking';
      btn.disabled    = (b.status || b.bookingStatus) === 'cancelled';
      btn.style.background = (b.status || b.bookingStatus) === 'cancelled' ? '#c4c4c4' : '#d64545';
      document.getElementById('bkOverlay').style.display = 'flex';
    };

    window.closeBkModal = function() {
      document.getElementById('bkOverlay').style.display = 'none';
      activeBookingId = null;
    };

    window.doCancelBooking = async function() {
      if (!activeBookingId) return;
      if (!confirm('Cancel booking ' + activeBookingId + '?\n\nThis will free the slot so it can be rebooked.')) return;
      const btn = document.getElementById('bkCancelBtn');
      btn.textContent = 'Cancelling…';
      btn.disabled = true;
      try {
        const r = await fetch('/api/admin/booking?id=' + encodeURIComponent(activeBookingId), {
          method: 'DELETE', credentials: 'same-origin',
        });
        if (!r.ok) { const d = await r.json(); throw new Error(d.error || r.statusText); }
        closeBkModal();
        refresh();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.textContent = 'Cancel Booking';
        btn.disabled = false;
      }
    };

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.replace('/admin/index.html');
    });

    async function init() {
      try {
        const r = await fetch('/api/admin/me', { credentials: 'same-origin' });
        if (!r.ok) { window.location.replace('/admin/index.html'); return; }
        const { username } = await r.json();
        document.getElementById('navUser').textContent = username;
      } catch { window.location.replace('/admin/index.html'); return; }
      await loadData();
      render();
    }

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    init();
  </script>
</body>
</html>

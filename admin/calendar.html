<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SHOOT. Admin — Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <style>
    /* ── View switcher ─────────────────────────────────── */
    .view-btns { display: flex; gap: 0; border: 1px solid rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
    .view-btn {
      font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 6px 14px; border: none; cursor: pointer;
      background: none; color: rgba(255,255,255,0.4); transition: all 0.15s;
      border-right: 1px solid rgba(255,255,255,0.12);
    }
    .view-btn:last-child { border-right: none; }
    .view-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .view-btn.active { background: rgba(255,255,255,0.12); color: #fff; }

    /* ── Month view ───────────────────────────────────── */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 4px;
      overflow: hidden;
    }
    .month-day-header {
      font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.25); padding: 10px 8px; text-align: center;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .month-day-header:last-child { border-right: none; }
    .month-cell {
      min-height: 90px; padding: 6px; border-right: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; background: transparent;
    }
    .month-cell:nth-child(7n) { border-right: none; }
    .month-cell.other-month { opacity: 0.3; }
    .month-cell.is-today { background: rgba(96, 216, 144, 0.04); }
    .month-cell-date {
      font-size: 12px; font-weight: 700; font-style: italic; color: rgba(255,255,255,0.4);
      margin-bottom: 4px; line-height: 1;
    }
    .month-cell-date.today { color: #60d890; }
    .month-event {
      display: block; font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
      padding: 2px 5px; border-radius: 2px; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-decoration: none; color: #fff; cursor: pointer; transition: opacity 0.1s;
      border-left: 2px solid transparent;
    }
    .month-event:hover { opacity: 0.75; }
    .month-event-curve   { background: rgba(96,130,255,0.18); border-left-color: rgba(96,130,255,0.8); }
    .month-event-studio1 { background: rgba(255,180,50,0.15);  border-left-color: rgba(255,180,50,0.8); }
    .month-event-pool    { background: rgba(60,210,150,0.15);  border-left-color: rgba(60,210,150,0.8); }
    .month-event-block   { background: rgba(255,255,255,0.05); border-left-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.4); }
    .month-more { font-size: 9px; color: rgba(255,255,255,0.3); padding: 1px 5px; }

    /* ── Week view ────────────────────────────────────── */
    .week-grid {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 4px;
      overflow: hidden;
      min-width: 680px;
    }
    .week-corner {
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .week-day-header {
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.05);
      padding: 10px 8px; text-align: center;
    }
    .week-day-header:last-child { border-right: none; }
    .week-day-header.is-today { background: rgba(96,216,144,0.06); }
    .week-day-name { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
    .week-day-num { font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: -0.5px; line-height: 1; }
    .week-day-num.today { color: #60d890; }
    .week-studio-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.25); padding: 10px 8px;
      border-right: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: flex-start; background: rgba(255,255,255,0.01);
    }
    .week-studio-label.last { border-bottom: none; }
    .week-cell {
      border-right: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 6px; min-height: 80px;
    }
    .week-cell:last-child { border-right: none; }
    .week-cell.last { border-bottom: none; }
    .week-studio-label.last { border-bottom: none; }
    .week-empty { color: rgba(255,255,255,0.08); font-size: 10px; text-align: center; padding-top: 20px; }
    .cal-event-block { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); }
    .cal-event-block:hover { background: rgba(255,255,255,0.07); }

    /* ── Day view ─────────────────────────────────────── */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .day-column {
      background: #111;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 4px;
      overflow: hidden;
    }
    .day-column-header {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.3); padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
    }
    .day-event {
      display: block; padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      text-decoration: none; color: #fff; transition: background 0.1s; cursor: pointer;
    }
    .day-event:hover { background: rgba(255,255,255,0.04); }
    .day-event:last-child { border-bottom: none; }
    .day-event-time { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; margin-bottom: 4px; }
    .day-event-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .day-event-block { background: rgba(255,255,255,0.02); }
    .day-event-block:hover { background: rgba(255,255,255,0.04); }
    .day-empty { padding: 32px 16px; color: rgba(255,255,255,0.18); font-size: 12px; text-align: center; }

    /* ── Delete button ────────────────────────────────── */
    .del-btn {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 6px;
      background: rgba(255,60,60,0.18); border: 1px solid rgba(255,80,80,0.35);
      color: #ff7070; border-radius: 2px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      padding: 4px 8px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .del-btn:hover { background: rgba(255,60,60,0.35); color: #fff; }
    .cal-event { position: relative; }

    @media (max-width: 768px) {
      .day-grid { grid-template-columns: 1fr; }
      .week-grid { grid-template-columns: 60px repeat(7, 1fr); }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-left">
      <a class="nav-brand" href="/admin/dashboard.html">SHOOT. <span>Admin</span></a>
      <div class="nav-links">
        <a class="nav-link" href="/admin/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/admin/bookings.html">Bookings</a>
        <a class="nav-link active" href="/admin/calendar.html">Calendar</a>
        <a class="nav-link" href="/admin/coupons.html">Coupons</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="nav-user" id="navUser">—</div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
    </div>
  </nav>

  <main>
    <!-- Header: title + controls -->
    <div class="page-header">
      <div class="page-title">Calendar.</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <!-- Navigation -->
        <button class="btn btn-ghost btn-sm" id="prevBtn">← Prev</button>
        <div id="calLabel" style="font-size:14px;font-weight:700;letter-spacing:-0.3px;min-width:200px;text-align:center"></div>
        <button class="btn btn-ghost btn-sm" id="nextBtn">Next →</button>
        <button class="btn btn-ghost btn-sm" id="todayBtn">Today</button>
        <!-- View switcher -->
        <div class="view-btns">
          <button class="view-btn" data-view="month">Month</button>
          <button class="view-btn active" data-view="week">Week</button>
          <button class="view-btn" data-view="day">Day</button>
        </div>
      </div>
    </div>

    <div style="overflow-x:auto">
      <div id="calContainer">
        <div style="padding:48px;text-align:center;color:rgba(255,255,255,0.2);font-size:12px">Loading...</div>
      </div>
    </div>
  </main>

  <script>
    const STUDIOS = [
      { key: 'curve',   label: 'The Curve' },
      { key: 'studio1', label: 'Studio One' },
      { key: 'pool',    label: 'The Pool' },
    ];
    const DAY_NAMES  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const STATUS_CLASS = { confirmed: 'badge-green', cancelled: 'badge-red', pending: 'badge-yellow' };
    const STUDIO_EVENT_CLASS = { curve: 'month-event-curve', studio1: 'month-event-studio1', pool: 'month-event-pool' };

    let view = 'week';
    let currentDate = new Date();
    let allBookings = [];
    let allBlocks   = [];

    // ── Date helpers ───────────────────────────────────────────────────────
    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
      date.setHours(0, 0, 0, 0);
      return date;
    }
    function toCA(d) { return d.toLocaleDateString('en-CA', { timeZone: 'Africa/Johannesburg' }); }
    function todayStr() { return toCA(new Date()); }
    function fmtShort(s) { if (!s) return '—'; const d = new Date(s + 'T12:00:00'); return `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)}`; }

    function getVisibleRange() {
      if (view === 'month') {
        const y = currentDate.getFullYear(), m = currentDate.getMonth();
        const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
        return { from: toCA(first), to: toCA(last) };
      }
      if (view === 'week') {
        const mon = getMonday(currentDate); const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
        return { from: toCA(mon), to: toCA(sun) };
      }
      const d = toCA(currentDate);
      return { from: d, to: d };
    }

    // ── Data loading ────────────────────────────────────────────────────────
    async function loadData() {
      const { from, to } = getVisibleRange();
      try {
        // Bookings for visible range
        const r = await fetch(`/api/admin/bookings?from=${from}&to=${to}&limit=500`, { credentials: 'same-origin' });
        if (r.ok) {
          const d = await r.json();
          allBookings = d.bookings || [];
          // If paginated (shouldn't happen with limit=500, but just in case)
          if (d.pages > 1) {
            for (let p = 2; p <= d.pages; p++) {
              const r2 = await fetch(`/api/admin/bookings?from=${from}&to=${to}&limit=500&page=${p}`, { credentials: 'same-origin' });
              if (r2.ok) { const d2 = await r2.json(); allBookings = allBookings.concat(d2.bookings || []); }
            }
          }
        }
        // All blocks (filter client-side)
        const rb = await fetch('/api/admin/slots?all=1', { credentials: 'same-origin' });
        if (rb.ok) { const db = await rb.json(); allBlocks = db.blocks || []; }
      } catch (err) {
        console.error('Failed to load calendar data:', err);
      }
    }

    // ── Navigation ──────────────────────────────────────────────────────────
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (view === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
      else if (view === 'week') currentDate.setDate(currentDate.getDate() - 7);
      else currentDate.setDate(currentDate.getDate() - 1);
      refresh();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (view === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
      else if (view === 'week') currentDate.setDate(currentDate.getDate() + 7);
      else currentDate.setDate(currentDate.getDate() + 1);
      refresh();
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date(); refresh();
    });
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        view = btn.dataset.view;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        refresh();
      });
    });

    async function refresh() {
      document.getElementById('calContainer').innerHTML =
        '<div style="padding:48px;text-align:center;color:rgba(255,255,255,0.2);font-size:12px">Loading...</div>';
      await loadData();
      render();
    }

    // ── Render ──────────────────────────────────────────────────────────────
    function render() {
      updateLabel();
      if (view === 'month') renderMonth();
      else if (view === 'week') renderWeek();
      else renderDay();
    }

    function updateLabel() {
      const el = document.getElementById('calLabel');
      if (view === 'month') {
        el.textContent = `${MONTH_NAMES[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
      } else if (view === 'week') {
        const mon = getMonday(currentDate);
        const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
        el.textContent = `${fmtShort(toCA(mon))} — ${fmtShort(toCA(sun))} ${mon.getFullYear()}`;
      } else {
        const d = new Date(toCA(currentDate) + 'T12:00:00');
        el.textContent = `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
      }
    }

    // ── Month render ────────────────────────────────────────────────────────
    function renderMonth() {
      const y = currentDate.getFullYear(), m = currentDate.getMonth();
      const firstDay = new Date(y, m, 1), lastDay = new Date(y, m + 1, 0);
      const today = todayStr();

      // Offset: Monday-based (Mon=0 ... Sun=6)
      let startDow = firstDay.getDay(); // 0=Sun
      const offset = startDow === 0 ? 6 : startDow - 1;
      const totalCells = Math.ceil((offset + lastDay.getDate()) / 7) * 7;

      // Index bookings & blocks by date
      const byDate = {};
      const blocksByDate = {};
      for (const b of allBookings) {
        if (!byDate[b.date]) byDate[b.date] = [];
        byDate[b.date].push(b);
      }
      for (const blk of allBlocks) {
        if (!blocksByDate[blk.date]) blocksByDate[blk.date] = [];
        blocksByDate[blk.date].push(blk);
      }

      let html = '<div class="month-grid">';
      // Headers
      ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
        html += `<div class="month-day-header">${d}</div>`;
      });

      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - offset + 1;
        const date = new Date(y, m, dayNum);
        const dateStr = toCA(date);
        const isCurrentMonth = date.getMonth() === m;
        const isToday = dateStr === today;

        const events = (byDate[dateStr] || []).sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
        const blocks = blocksByDate[dateStr] || [];
        const MAX_VISIBLE = 3;
        const totalEvents = events.length + blocks.length;
        const overflow = totalEvents - MAX_VISIBLE;

        html += `<div class="month-cell ${isCurrentMonth ? '' : 'other-month'} ${isToday ? 'is-today' : ''}">`;
        html += `<div class="month-cell-date ${isToday ? 'today' : ''}">${date.getDate()}</div>`;

        let shown = 0;
        for (const b of events) {
          if (shown >= MAX_VISIBLE) break;
          const studio = (b.studios || [])[0] || '';
          const cls = STUDIO_EVENT_CLASS[studio] || '';
          html += `<a class="month-event ${cls}" href="/admin/booking-detail.html?id=${esc(b.bookingId)}" title="${esc(b.name)} · ${esc(b.studiosLabel)} · ${b.time || ''}">
            ${b.time ? `<span style="opacity:.6">${b.time}</span> ` : ''}${esc(b.name || b.studiosLabel)}
          </a>`;
          shown++;
        }
        for (const blk of blocks) {
          if (shown >= MAX_VISIBLE) break;
          html += `<div class="month-event month-event-block" title="${esc(blk.reason || 'Blocked')}">
            ${blk.scope === 'full_day' ? 'Blocked' : `${blk.startTime} Blocked`}
          </div>`;
          shown++;
        }
        if (overflow > 0) {
          html += `<div class="month-more">+${overflow} more</div>`;
        }
        html += '</div>';
      }
      html += '</div>';
      document.getElementById('calContainer').innerHTML = html;
    }

    // ── Week render ─────────────────────────────────────────────────────────
    function renderWeek() {
      const mon = getMonday(currentDate);
      const today = todayStr();
      const weekDates = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mon); d.setDate(d.getDate() + i);
        return toCA(d);
      });

      // Index by date+studio
      const byDS = {};
      for (const b of allBookings) {
        for (const s of (b.studios || [])) {
          const k = `${b.date}|${s}`;
          if (!byDS[k]) byDS[k] = [];
          byDS[k].push(b);
        }
      }
      const blocksByDS = {};
      for (const blk of allBlocks) {
        const k = `${blk.date}|${blk.studio}`;
        if (!blocksByDS[k]) blocksByDS[k] = [];
        blocksByDS[k].push(blk);
      }

      let html = '<div class="week-grid">';
      // Corner + headers
      html += '<div class="week-corner"></div>';
      weekDates.forEach(date => {
        const d = new Date(date + 'T12:00:00');
        const isToday = date === today;
        html += `<div class="week-day-header ${isToday ? 'is-today' : ''}">
          <div class="week-day-name">${DAY_NAMES[d.getDay()]}</div>
          <div class="week-day-num ${isToday ? 'today' : ''}">${d.getDate()}</div>
        </div>`;
      });

      // Studio rows
      STUDIOS.forEach((studio, si) => {
        const isLast = si === STUDIOS.length - 1;
        html += `<div class="week-studio-label ${isLast ? 'last' : ''}">${studio.label}</div>`;
        weekDates.forEach(date => {
          const events = (byDS[`${date}|${studio.key}`] || []).sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
          const blocks = blocksByDS[`${date}|${studio.key}`] || [];
          html += `<div class="week-cell ${isLast ? 'last' : ''}">`;
          if (!events.length && !blocks.length) {
            html += '<div class="week-empty">—</div>';
          }
          events.forEach(b => {
            const sc = STATUS_CLASS[b.status] || 'badge-grey';
            html += `<a class="cal-event" href="/admin/booking-detail.html?id=${esc(b.bookingId)}">
              <div class="cal-event-time">${b.time || '—'} · ${esc(b.duration)}</div>
              <div>${esc(b.name)}</div>
              <div style="margin-top:3px"><span class="badge ${sc}" style="font-size:8px;padding:2px 5px">${b.status}</span></div>
              ${b.status !== 'cancelled' ? `<button class="del-btn" data-id="${esc(b.bookingId)}">✕ Cancel</button>` : ''}
            </a>`;
          });
          blocks.forEach(blk => {
            html += `<div class="cal-event cal-event-block">
              <div class="cal-event-time">${blk.scope === 'full_day' ? 'All Day' : blk.startTime + ' – ' + blk.endTime}</div>
              <div>${esc(blk.reason || 'Blocked')}</div>
            </div>`;
          });
          html += '</div>';
        });
      });
      html += '</div>';
      document.getElementById('calContainer').innerHTML = html;
    }

    // ── Day render ──────────────────────────────────────────────────────────
    function renderDay() {
      const dateStr = toCA(currentDate);
      const dayBookings = allBookings.filter(b => b.date === dateStr);
      const dayBlocks   = allBlocks.filter(b => b.date === dateStr);

      let html = '<div class="day-grid">';
      STUDIOS.forEach(studio => {
        const events = dayBookings.filter(b => (b.studios || []).includes(studio.key))
          .sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
        const blocks = dayBlocks.filter(b => b.studio === studio.key)
          .sort((a, b) => a.startMins - b.startMins);

        html += `<div class="day-column">
          <div class="day-column-header">${studio.label}</div>`;

        if (!events.length && !blocks.length) {
          html += '<div class="day-empty">No bookings</div>';
        }

        events.forEach(b => {
          const sc = STATUS_CLASS[b.status] || 'badge-grey';
          html += `<a class="cal-event day-event" href="/admin/booking-detail.html?id=${esc(b.bookingId)}">
            <div class="day-event-time">${b.time || '—'} · ${esc(b.duration)}</div>
            <div class="day-event-name">${esc(b.name)}</div>
            <div><span class="badge ${sc}" style="font-size:8px">${b.status}</span></div>
            ${b.status !== 'cancelled' ? `<button class="del-btn" data-id="${esc(b.bookingId)}">✕ Cancel</button>` : ''}
          </a>`;
        });
        blocks.forEach(blk => {
          html += `<div class="day-event day-event-block">
            <div class="day-event-time">${blk.scope === 'full_day' ? 'All Day' : blk.startTime + ' – ' + blk.endTime}</div>
            <div class="day-event-name" style="color:rgba(255,255,255,0.4)">${esc(blk.reason || 'Blocked')}</div>
          </div>`;
        });

        html += '</div>';
      });
      html += '</div>';
      document.getElementById('calContainer').innerHTML = html;
    }

    // ── Delete booking via ✕ button ─────────────────────────────────────────
    document.getElementById('calContainer').addEventListener('click', async e => {
      const btn = e.target.closest('.del-btn');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.id;
      if (!confirm(`Cancel booking ${id}?\n\nThis will free up the slot so it can be rebooked.`)) return;
      btn.textContent = '…';
      btn.disabled = true;
      try {
        const r = await fetch(`/api/admin/booking?id=${encodeURIComponent(id)}`, {
          method: 'DELETE', credentials: 'same-origin',
        });
        if (!r.ok) { const d = await r.json(); throw new Error(d.error || r.statusText); }
        refresh();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.textContent = '✕';
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.replace('/admin/index.html');
    });

    async function init() {
      try {
        const r = await fetch('/api/admin/me', { credentials: 'same-origin' });
        if (!r.ok) { window.location.replace('/admin/index.html'); return; }
        const { username } = await r.json();
        document.getElementById('navUser').textContent = username;
      } catch { window.location.replace('/admin/index.html'); return; }
      await loadData();
      render();
    }

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    init();
  </script>
</body>
</html>
